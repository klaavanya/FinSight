<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSight Account</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head>
<body class="auth-bg"><div class="auth-card"><div class="brand">◈ FinSight</div><p class="sub">Personal Finance & Investment Intelligence</p>
{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
{% if mode=="register" %}<h2>Create account</h2><form method="post"><label>Your name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Password (minimum 6 characters)</label><input type="password" name="password" minlength="6" required><button>Create account</button></form><p>Already registered? <a href="{{url_for('login')}}">Login here</a></p>
{% else %}<h2>Welcome back</h2><form method="post"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required><button>Login</button></form><p>New user? <a href="{{url_for('register')}}">Create an account</a></p>{% endif %}
</div></body></html>
